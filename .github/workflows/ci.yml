name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: E2E (real binary)
        run: go test -count=1 -v ./e2e/

  app:
    name: App (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependencies
        run: flutter pub get
      # Split per ABI: the fat APK bundles all three ABIs (~26 MB); a
      # family phone only ever installs one (~10 MB), so shipping the
      # per-ABI APKs halves the download for dogfooding.
      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi
      - name: Upload APKs
        uses: actions/upload-artifact@v5
        with:
          name: lodestar-apk
          path: |
            apps/lodestar/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            apps/lodestar/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            apps/lodestar/build/app/outputs/flutter-apk/app-x86_64-release.apk
          if-no-files-found: error
          retention-days: 30

  ios:
    name: iOS (archive compiles, no codesign)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - name: Dependencies
        run: flutter pub get
      # `flutter build ios --no-codesign` compiles the iOS archive on Linux
      # without a simulator or signing identity — it validates iOS plugin
      # linkage and the Dart build path for iOS. No simulator needed.
      - name: Build iOS archive (no codesign, verbose)
        run: flutter build ios --release --no-codesign --verbose 2>&1 | tail -40
      - name: Test
        run: flutter test

  f-droid:
    name: F-Droid (metadata + fastlane lane)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler: default
      - name: Install fastlane
        run: gem install fastlane
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependencies (app)
        run: flutter pub get
      - name: Fastlane F-Droid lane
        working-directory: ${{ github.workspace }}/fastlane
        run: bundle install && bundle exec fastlane f_droid
      - name: Upload F-Droid APKs
        uses: actions/upload-artifact@v5
        with:
          name: lodestar-fdroid
          path: |
            fastlane/metadata/android/*/dev.lodestar.lodestar_*.apk
          if-no-files-found: error
          retention-days: 30

  docker:
    name: Docker (server image build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The Dockerfile + compose are the documented deployment path; a
      # build regression there must fail CI, not the family's server.
      - name: Build server image
        run: docker build -f server/Dockerfile -t lodestar:ci .
      - name: Validate compose file
        run: docker compose config -q