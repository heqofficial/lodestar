name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Server (go test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25.x"
          cache-dependency-path: server/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...

  app:
    name: App (flutter analyze + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - name: Dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test

  android:
    name: Android (release APK)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/lodestar
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.x"
      - uses: gradle/actions/setup-gradle@v4
      - name: Dependencies
        run: flutter pub get
      - name: Build release APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: lodestar-apk
          path: apps/lodestar/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30