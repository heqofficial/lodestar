publish_to: "none"
version: 0.8.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.2.0
  latlong2: ^0.9.1
  location: ^8.0.0
  http: ^1.4.0
  web_socket_channel: ^3.0.3
  cryptography: ^2.7.0
  sqflite: ^2.4.2
  sensors_plus: ^6.1.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  intl: ^0.20.2
  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.3.0

flutter:
  uses-material-design: true