MaintainerNotes: >
  FLOSS, AGPL-3.0, no proprietary deps, no Google Play Services for messaging,
  self-hostable — good fit for the main repo.

  Build is reproducible in the sense that F-Droid rebuilds from source with its
  own keys; the upstream release APKs are debug-signed (fine for family
  sideloading) and are not uploaded as Binaries.

  The repo ships split per-ABI APKs; the F-Droid primary APK is the arm64-v8a
  build. First submission is a manual PR to the F-Droid repo adding this
  metadata file + the source tag; the `fastlane f_droid` lane reproduces the
  local build for verification.

  Push notifications: self-hosted ntfy (default) is FLOSS and fine; APNs for
  iOS is configured but APNs is a proprietary Apple service, so if you want the
  app in F-Droid with APNs enabled you must set AntiFeatures: [Ads] is NOT
  appropriate here — APNs is used only for wake-up alerts and never sends
  location/plaintext to Apple. Confirm the exact AntiFeatures classification
  with the F-Droid team before merging; the app does not display ads.

  ntfy is optional; the app works fully without any push provider.
