Description: >
  Lodestar is a free, open-source, end-to-end-encrypted family location app —
  Life360's usefulness without the surveillance business model.

  Your family's guiding star. Locations are end-to-end encrypted (X25519 +
  ChaCha20-Poly1305); the server stores only ciphertext and can never see
  where anyone is. Self-hosted — runs on a Raspberry Pi, an old laptop, or a
  free Oracle ARM VM. Android + iOS, one Flutter codebase, Go server.

  Features: circles with invite codes, live family map (OpenStreetMap, no paid
  API keys), adaptive motion-aware background tracking, on-device geofencing,
  E2E-encrypted chat, check-ins, one-tap SOS, driving reports (distance,
  duration, top/avg speed, speeding + hard-braking episodes), crash alerting
  (on-device impact detection), per-member sharing controls, and optional
  self-hosted push via ntfy. No Firebase, no Google Play Services, no analytics,
  no trackers. Consent-first — every member controls what they share, when, and
  with whom.

  This is a FLOSS app built with Flutter; the F-Droid build uses the same
  source as the upstream release APKs but is signed with F-Droid's own keys.
  Lodestar ships split per-ABI APKs; the F-Droid repo carries the arm64-v8a
  build as the primary APK.
