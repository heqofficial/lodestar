services:
  lodestar:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: lodestar:local
    container_name: lodestar
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      # The Dockerfile's default CMD already sets -addr and -data; these
      # env overrides come from a local .env file (see deploy/oracle-setup.sh):
      #   LODESTAR_ADMIN_TOKEN=<random>   protects /admin (empty = open)
      #   LODESTAR_NTFY_URL=http://host:port   enables the push relay
      #   LODESTAR_NTFY_TOKEN=...
      LODESTAR_ADMIN_TOKEN: ${LODESTAR_ADMIN_TOKEN:-}
      LODESTAR_NTFY_URL: ${LODESTAR_NTFY_URL:-}
      LODESTAR_NTFY_TOKEN: ${LODESTAR_NTFY_TOKEN:-}
    volumes:
      - ./data:/data

  # Optional self-hosted push notifications (https://ntfy.sh).
  # Uncomment to enable; then set LODESTAR_NTFY_URL=http://ntfy:80 above.
  # ntfy:
  #   image: binwiederhier/ntfy
  #   container_name: ntfy
  #   restart: unless-stopped
  #   command: serve
  #   volumes:
  #     - ./ntfy:/var/lib/ntfy
  #   ports:
  #     - "8080:80"